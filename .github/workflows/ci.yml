name: ci

on:
  push:
    branches: [main]
  pull_request:

# Default to read-only; widen per-job only where strictly needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Job display name MUST stay exactly "ci" — the `main` branch ruleset's
    # required_status_checks rule requires a check literally named "ci"
    # (GitHub Actions check-runs are named after the job's `name:`, not the
    # workflow's `name:`). Renaming this breaks the merge gate silently
    # (PRs stay "blocked" even with every check green) — verified 2026-10-12.
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Guard — no AI/agent before Phase 6 (B0-08)
        run: pnpm check:no-ai

      - name: Lint
        run: pnpm lint

      - name: Server-import ban (B0-03)
        run: pnpm check:server-import-ban

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Scaffold has no DB/storage dependency at build time yet (Phase 0).
          # Add real build-time env here once P0-03/P0-04 land in CI.
          NEXT_TELEMETRY_DISABLED: "1"

  db-tests:
    name: db-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chopda
          POSTGRES_PASSWORD: chopda
          POSTGRES_DB: chopda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chopda -d chopda_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://chopda:chopda@localhost:5432/chopda_test
      DATABASE_URL_DIRECT: postgres://chopda:chopda@localhost:5432/chopda_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Apply migrations (if any SQL present)
        run: |
          if find db/migrations -type f -name '*.sql' ! -iname 'README.sql' | grep -q .; then
            pnpm db:migrate
          else
            echo "No SQL migrations yet — skipping migrate."
          fi

      - name: DB tests
        run: pnpm exec vitest run tests/db
